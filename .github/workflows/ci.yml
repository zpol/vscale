name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Build agent
        run: CGO_ENABLED=0 go build -o /tmp/vscale ./cmd/vscale
      - name: Build control-plane
        run: CGO_ENABLED=0 go build -o /tmp/vscale-control-plane ./cmd/control-plane
      - name: Build .deb
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh
          dpkg-deb -I dist/vscale_*.deb
