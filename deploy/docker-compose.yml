services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vscale
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vscale}
      POSTGRES_DB: vscale
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vscale -d vscale"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      DB_HOST: postgres
      DB_USER: vscale
      DB_PASSWORD: ${DB_PASSWORD:-vscale}
      DB_NAME: vscale
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - control-plane

volumes:
  pgdata:
