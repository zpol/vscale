apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: vscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: vscale-control-plane:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              value: vscale
            - name: DB_NAME
              value: vscale
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vscale-db
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vscale-db
                  key: jwt
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vscale-db
                  key: admin-password
            - name: PUBLIC_URL
              value: http://192.168.68.113:30808
            - name: HTTP_ADDR
              value: ":8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: vscale
spec:
  type: NodePort
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808
