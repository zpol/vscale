apiVersion: v1
kind: Secret
metadata:
  name: vscale-db
  namespace: vscale
type: Opaque
stringData:
  password: vscale
  jwt: change-me-vscale-jwt
  admin-password: admin123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vscale-postgres
  namespace: vscale
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: vscale
            - name: POSTGRES_DB
              value: vscale
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vscale-db
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vscale", "-d", "vscale"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vscale-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vscale
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
