services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vscale
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vscale
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [vscale]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vscale -d vscale"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.control-plane
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: vscale
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: vscale
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@vscale.local}
      PUBLIC_URL: ${PUBLIC_URL}
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      VSCALE_GLOBAL_POOL: ${VSCALE_GLOBAL_POOL:-10.66.0.0/16}
      VSCALE_PREFIX_LEN: ${VSCALE_PREFIX_LEN:-24}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vscale]

  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
      args:
        REACT_APP_API_URL: ${PUBLIC_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - control-plane
    networks: [vscale]

  hub:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.agent
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      VSCALE_STATE: /data/state.json
      VSCALE_WG_CONF: /etc/wireguard/vscale0.conf
    volumes:
      - hubdata:/data
      - hubwg:/etc/wireguard
    command: ["daemon"]
    # Hub credentials are injected after first bootstrap via scripts/bootstrap-hub.sh
    profiles: ["hub"]

networks:
  vscale:

volumes:
  pgdata:
  hubdata:
  hubwg:
